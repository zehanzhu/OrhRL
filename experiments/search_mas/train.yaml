defaults:
- ../../orchrl/config/ppo_trainer@models.model_0.ppo_trainer_config: base
- ../../orchrl/config/ppo_trainer@models.model_1.ppo_trainer_config: base
- ../../orchrl/config/ppo_trainer@models.model_2.ppo_trainer_config: base
- _self_
workflow_type: external_mas
specialization: role_specific # role_specific | role_sharing
resource:
  nnodes: 1
  n_gpus_per_node: 6
  trust_remote_code: true
env:
  name: search_env
  dataset: drmas_search
  benchmark: drmas_search_nosearch
  multi_modal: false
  batched_init: true
agent_policy_configs:
  agent_configs:
    agent_0:
      name: verifier
      policy_name: verifier_model
      train_llm_config:
        enable_thinking: false
        temperature: 0.6
        top_p: 0.95
        top_k: 20
        min_p: 0.0
      val_llm_config:
        enable_thinking: false
        temperature: 0.6
        top_p: 1.0
        top_k: 20
        min_p: 0.0
    agent_1:
      name: searcher
      policy_name: searcher_model
      train_llm_config:
        enable_thinking: false
        temperature: 0.6
        top_p: 0.95
        top_k: 20
        min_p: 0.0
      val_llm_config:
        enable_thinking: false
        temperature: 0.6
        top_p: 1.0
        top_k: 20
        min_p: 0.0
    agent_2:
      name: answerer
      policy_name: answerer_model
      train_llm_config:
        enable_thinking: false
        temperature: 0.6
        top_p: 0.95
        top_k: 20
        min_p: 0.0
      val_llm_config:
        enable_thinking: false
        temperature: 0.6
        top_p: 1.0
        top_k: 20
        min_p: 0.0
base_models:
  policy_0:
    path: /mnt/bn/chenghao1026/models/Qwen3-8B
    name: verifier_model
  policy_1:
    path: /mnt/bn/chenghao1026/models/Qwen3-8B
    name: searcher_model
  policy_2:
    path: /mnt/bn/chenghao1026/models/Qwen3-8B
    name: answerer_model
training:
  rollout_source: mate
  device: cuda
  total_training_steps: 100
  project_name: orchrl
  experiment_name: search_mas_app
  output_root_dir: outputs/training_runs
  data_root_dir: /mnt/bn/chenghao1026/zzh/drmas_search_mas
  train_data_path: ${training.data_root_dir}/train.parquet
  val_data_path: ${training.data_root_dir}/test_sampled.parquet
  # val_data_path: ${training.data_root_dir}/test.parquet
  run_name: ${training.experiment_name}
  run_id: ${now:%Y%m%d_%H%M%S}
  run_dir: ${training.output_root_dir}/${training.run_name}/${training.run_id}
  logger:
  - console
  - wandb
  if_save: false
  model_checkpoints_dir: ${training.run_dir}/checkpoints
  ray_wait_register_center_timeout: 300
  train_batch_size: 2
  validate_batch_size: 10
  train_sample_num: 1
  sample_temperature: 0.6
  val_freq: 5
  max_prompt_length: 1536
  max_response_length: 1024
  mate:
    roles: [verifier, searcher, answerer]
    role_policy_mapping:
      verifier: verifier_model
      searcher: searcher_model
      answerer: answerer_model
    max_prompt_length: ${training.max_prompt_length}
    max_response_length: ${training.max_response_length}
    prompt_truncation: left
    batch_size: ${training.train_batch_size}
    # n_samples_per_prompt: ${training.train_sample_num}
    n_samples_per_prompt: 4
    rollout_mode: parallel # tree | parallel
    tree:
      k_branches: 4
      max_concurrent_branches: 4
    max_concurrent_episodes: 8
    monitor_pool:
      size: 10
      host: 127.0.0.1
      base_port: 19000
      acquire_timeout_sec: 300
    timeout: 120
    backend_timeout: 120
    credit_assignment: all_turns
    failure_policy:
      mode: threshold
      max_failed_rate: 0.9
    mas_work_dir: mas_apps/search
    mas_log_dir: ${training.run_dir}/mas_logs
    mas_command_template: python scripts/run_search_mas.py --config {config_path} --question {prompt}
    config_template_path: mas_apps/search/configs/inference.yaml
    prompt_loader:
      source_type: parquet
      path: ${training.train_data_path}
      prompt_keys: [question, prompt, query, problem, input]
      expected_keys: [expected_answer, answer, expected_answers, gold_answer, golden_answers, target, label]
      train_repeat: true
      train_shuffle: true
      train_seed: 0
    reward:
      provider: task_plugins.search_mas.reward:compute_reward
      match_mode: exact
    trajectory_export:
      enable: true
      output_dir: ${training.run_dir}/trajectories
      write_json: true
      write_txt: true
      include_token_details: true
      answer_stats_provider: task_plugins.search_mas.reward:build_answer_stats
      answer_stats_kwargs:
        match_mode: exact
models:
  model_0:
    path: ${base_models.policy_0.path}
    name: ${base_models.policy_0.name}
    ppo_trainer_config:
      filter_method: uid
      filter_ratio: 0.0
      data:
        train_files: ${training.train_data_path}
        val_files: ${training.val_data_path}
        max_prompt_length: ${training.max_prompt_length}
        max_response_length: ${training.max_response_length}
      actor_rollout_ref:
        model:
          path: ${base_models.policy_0.path}
          override_config:
            model_id: ${base_models.policy_0.name}
        actor:
          ppo_max_token_len_per_gpu: 3072
        ref:
          log_prob_max_token_len_per_gpu: 3072
        rollout:
          temperature: ${training.sample_temperature}
          prompt_length: ${training.max_prompt_length}
          response_length: ${training.max_response_length}
          max_model_len: 3072
          max_num_batched_tokens: 2048
          max_num_seqs: 8
          log_prob_max_token_len_per_gpu: 3072
          tensor_model_parallel_size: 2
          enforce_eager: false
          gpu_memory_utilization: 0.6
          prometheus:
            served_model_name: verifier_model
        trainer:
          n_gpus_per_node: 2
          n_training_gpus_per_node: 2
  model_1:
    path: ${base_models.policy_1.path}
    name: ${base_models.policy_1.name}
    ppo_trainer_config:
      filter_method: uid
      filter_ratio: 0.0
      data:
        train_files: ${training.train_data_path}
        val_files: ${training.val_data_path}
        max_prompt_length: ${training.max_prompt_length}
        max_response_length: ${training.max_response_length}
      actor_rollout_ref:
        model:
          path: ${base_models.policy_1.path}
          override_config:
            model_id: ${base_models.policy_1.name}
            # attn_implementation: eager
        actor:
          ppo_max_token_len_per_gpu: 3072
        ref:
          log_prob_max_token_len_per_gpu: 3072
        rollout:
          temperature: ${training.sample_temperature}
          prompt_length: ${training.max_prompt_length}
          response_length: ${training.max_response_length}
          max_model_len: 3072
          max_num_batched_tokens: 2048
          max_num_seqs: 8
          log_prob_max_token_len_per_gpu: 3072
          tensor_model_parallel_size: 2
          enforce_eager: false
          gpu_memory_utilization: 0.6
          prometheus:
            served_model_name: searcher_model
        trainer:
          n_gpus_per_node: 2
          n_training_gpus_per_node: 2
  model_2:
    path: ${base_models.policy_2.path}
    name: ${base_models.policy_2.name}
    ppo_trainer_config:
      filter_method: uid
      filter_ratio: 0.0
      data:
        train_files: ${training.train_data_path}
        val_files: ${training.val_data_path}
        max_prompt_length: ${training.max_prompt_length}
        max_response_length: ${training.max_response_length}
      actor_rollout_ref:
        model:
          path: ${base_models.policy_2.path}
          override_config:
            model_id: ${base_models.policy_2.name}
        actor:
          ppo_max_token_len_per_gpu: 3072
        ref:
          log_prob_max_token_len_per_gpu: 3072
        rollout:
          temperature: ${training.sample_temperature}
          prompt_length: ${training.max_prompt_length}
          response_length: ${training.max_response_length}
          max_model_len: 3072
          max_num_batched_tokens: 2048
          max_num_seqs: 8
          log_prob_max_token_len_per_gpu: 3072
          tensor_model_parallel_size: 2
          enforce_eager: false
          gpu_memory_utilization: 0.6
          prometheus:
            served_model_name: answerer_model
        trainer:
          n_gpus_per_node: 2
          n_training_gpus_per_node: 2